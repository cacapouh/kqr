# Single-broker Kafka in KRaft mode for local development, manual smoke
# checks and the docker-based integration tests planned in step 8.
#
# Bring up:    docker compose -f docker/compose.yaml up -d --wait
# Tear down:   docker compose -f docker/compose.yaml down -v
#
# The cluster is intentionally minimal — single node, PLAINTEXT, no auth.
# Production-style configuration (SASL etc.) is exercised via the kqr
# Profile config, not by changing this dev cluster.

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kqr-kafka
    ports:
      - "9092:9092"   # ホストからは localhost:9092
      - "9094:9094"   # docker network 内のコンテナからは kafka:9094
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 2 つの PLAINTEXT listener: HOST はホスト OS から、DOCKER は同じ network
      # 内のコンテナから (docker run / compose run の kqr 用)。
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
